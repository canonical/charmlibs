[project]
name = "charmlibs-interfaces-forward-auth"
description = "The charmlibs.interfaces.forward_auth package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="Identity Team at Canonical"},
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
]
dynamic = ["version"]
dependencies = [
    "jsonschema>=4.26.0",
    "ops>=2.23.1,<4",
]


[dependency-groups]
lint = [  # installed for `just lint interfaces/forward_auth` (unit, functional, and integration are also installed)
    # "typing_extensions",
]
unit = [  # installed for `just unit interfaces/forward_auth`
    "ops[testing]",
]
functional = [  # installed for `just functional interfaces/forward_auth`
]
integration = [  # installed for `just integration interfaces/forward_auth`
    "jubilant",
]

[project.urls]
"Documentation" = "https://canonical.com/juju/docs/charmlibs/reference/charmlibs/interfaces/forward-auth"
"Repository" = "https://github.com/canonical/charmlibs/tree/main/interfaces/forward_auth"
"Issues" = "https://github.com/canonical/charmlibs/issues"
"Changelog" = "https://github.com/canonical/charmlibs/blob/main/interfaces/forward_auth/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlibs"]

[tool.hatch.version]
path = "src/charmlibs/interfaces/forward_auth/_version.py"


[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests/unit", "tests/functional", "tests/integration"]  # correctly sort local imports in tests

[tool.ruff.lint.extend-per-file-ignores]
# add additional per-file-ignores here to avoid overriding repo-level config
"src/charmlibs/interfaces/forward_auth/_forward_auth.py" = [
    "B904",      # Within except clause, raise from
    "E501",      # Line too long
    "G004",      # Logging f-string
    "PERF203",   # try-except in loop
]
"src/charmlibs/interfaces/forward_auth/__init__.py" = [
    "E501",      # Line too long
]
"tests/**/*" = [
    "E501",      # Line too long
]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["src", "tests"]
ignore = ["tests/integration/charms"]
pythonVersion = "3.10"  # check no python > 3.10 features are used

[tool.charmlibs.functional]
ubuntu = []  # ubuntu versions to run functional tests with, e.g. "24.04" (defaults to just "latest")
pebble = []  # pebble versions to run functional tests with, e.g. "v1.0.0", "master" (defaults to no pebble versions)
sudo = false  # whether to run functional tests with sudo (defaults to false)

[tool.charmlibs.integration]
# tags to run integration tests with (defaults to running once with no tag, i.e. tags = [''])
# Available in CI in tests/integration/pack.sh and integration tests as CHARMLIBS_TAG
tags = []  # Not used by the pack.sh and integration tests generated by the template
