[project]
name = "charmlibs-interfaces-tls-certificates-testing"
description = "The charmlibs.interfaces.tls_certificates_testing package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="The TLS team at Canonical"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
]
dynamic = ["version"]
dependencies = [
    # Pinned exactly: this package reuses the library's private wire format, so the two are
    # released in lockstep and cannot be allowed to drift.
    "charmlibs-interfaces-tls-certificates==1.11.0",
    "cryptography>=43.0.0",  # match the library's constraint
    "ops[testing]",
]

[dependency-groups]
lint = [  # installed for `just lint interfaces/tls-certificates/testing` (unit, functional, and integration are also installed)
]
unit = [  # installed for `just unit interfaces/tls-certificates/testing`
]
functional = []  # group required by CI, but functional tests aren't recommended for testing packages
integration = []  # group required by CI, but integration tests aren't recommended for testing packages

[project.urls]
"Documentation" = "https://canonical.com/juju/docs/charmlibs/reference/testing/charmlibs-interfaces-tls-certificates-testing"
"Repository" = "https://github.com/canonical/charmlibs/tree/main/interfaces/tls-certificates/testing"
"Issues" = "https://github.com/canonical/charmlibs/issues"
"Changelog" = "https://github.com/canonical/charmlibs/blob/main/interfaces/tls-certificates/testing/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlibs"]

[tool.hatch.version]
path = "src/charmlibs/interfaces/tls_certificates_testing/_version.py"

[tool.uv.sources]
charmlibs-interfaces-tls-certificates = { path = "../", editable = true }

[tool.ruff]
extend = "../pyproject.toml"
src = ["src", "tests/unit"]  # correctly sort local imports in tests

[tool.ruff.format]
quote-style = "double"  # match the library

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "E501",  # line too long
]

[tool.pyright]
extends = "../pyproject.toml"
include = ["src", "tests", "generate_raw.py"]
pythonVersion = "3.10"  # check no python > 3.10 features are used
