[project]
name = "charmlibs-interfaces-smtp-testing"
description = "The charmlibs.interfaces.smtp_testing package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="The Charm Tech team at Canonical"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
]
dynamic = ["version"]
dependencies = [
    "ops[testing]",
    "charmlibs-interfaces-smtp==0.0.0.dev0",
]

[dependency-groups]
lint = [  # installed for `just lint interfaces/smtp/testing` (unit, functional, and integration are also installed)
    # "typing_extensions",
]
unit = [  # installed for `just unit interfaces/smtp/testing`
]
functional = []  # group required by CI, but functional tests aren't recommended for testing packages
integration = []  # group required by CI, but integration tests aren't recommended for testing packages

[project.urls]
"Repository" = "https://github.com/canonical/charmlibs"
"Issues" = "https://github.com/canonical/charmlibs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlibs"]

[tool.hatch.version]
path = "src/charmlibs/interfaces/smtp_testing/_version.py"

[tool.uv.sources]
charmlibs-interfaces-smtp = { path = "../", editable = true }

[tool.ruff]
extend = "../pyproject.toml"
src = ["src", "tests/unit"]  # correctly sort local imports in tests

[tool.pyright]
extends = "../pyproject.toml"
include = ["src", "tests"]
pythonVersion = "3.10"  # check no python > 3.10 features are used
